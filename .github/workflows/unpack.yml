name: Validate Surge R12 ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require candidate archive
        run: test -f Surge.zip

      - name: Stage allowlisted files safely
        run: python tools/stage_surge_zip.py Surge.zip "${RUNNER_TEMP}/surge-candidate"

      - name: Audit staged profile
        run: |
          python tools/audit_config.py "${RUNNER_TEMP}/surge-candidate/Surge.conf"
          if test -d "${RUNNER_TEMP}/surge-candidate/Rules"; then
            python tools/audit_rules.py "${RUNNER_TEMP}/surge-candidate/Rules"
          fi

      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: surge-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/surge-candidate
          if-no-files-found: error
          retention-days: 7
